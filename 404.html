<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Page not found — Mahrs Aslam</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/portfolio/assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wdth,wght@0,75..100,400..700;1,75..100,400..700&amp;family=Geist+Mono:wght@400..600&amp;display=swap" />
    <link rel="stylesheet" href="/portfolio/css/style.css?v=20261026e" />
    <script>
      try {
        var t = localStorage.getItem("mahrs-theme");
        if (t === "dark" || t === "light") document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
      /* GitHub Pages serves 404.html from the repo root; fix relative asset paths for nested URLs. */
      (function () {
        var depth = location.pathname.split("/").filter(Boolean).length;
        var base = depth > 1 ? "../".repeat(depth - 1) : "";
        document.querySelectorAll('link[href^="css/"]').forEach(function (l) { l.href = base + l.getAttribute("href"); });
      })();
    </script>
  </head>
  <body>
    <main class="wrap lost">
      <p class="eyebrow">404</p>
      <h1>That page wandered off.</h1>
      <p class="lead" style="margin:auto">Change blindness, probably. The link you followed points at something that isn't here any more.</p>
      <p><a class="btn btn-primary" href="/portfolio/">Back to the start</a></p>
    </main>
    <script src="/portfolio/js/main.js?v=20261026a"></script>
    <!-- Search hidden for now: <script src="/portfolio/js/navigator.js?v=20261015"></script> -->
  </body>
</html>
