<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="'Instrument Sans', Inter, Helvetica, Arial, sans-serif">
  <!-- Amplify, recreated: the letter flow (find your representatives, review the letter, sign, send).
       Drawn flat so it sits with the other covers; names are bars, not real people. -->
  <defs>
    <clipPath id="win"><rect x="150" y="100" width="1300" height="960" rx="18"/></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1F3A63" flood-opacity=".16"/>
    </filter>
    <!-- one representative row's avatar, reused three times -->
    <g id="rep">
      <circle cx="233" cy="0" r="30" fill="#D8E0EC"/>
      <circle cx="233" cy="-9" r="11" fill="#9EB0C8"/>
      <path d="M212 20 a21 21 0 0 1 42 0 z" fill="#9EB0C8"/>
    </g>
  </defs>

  <!-- no backdrop: the page paints it (.cover-frame in accents.css) so it follows light/dark -->

  <!-- browser window, running off the bottom of the frame -->
  <g filter="url(#shadow)">
    <rect x="150" y="100" width="1300" height="960" rx="18" fill="#FFFFFF"/>
  </g>
  <g clip-path="url(#win)">
    <!-- title bar -->
    <rect x="150" y="100" width="1300" height="46" fill="#F3F4F6"/>
    <circle cx="182" cy="123" r="7" fill="#D9DCE1"/>
    <circle cx="206" cy="123" r="7" fill="#D9DCE1"/>
    <circle cx="230" cy="123" r="7" fill="#D9DCE1"/>
    <rect x="560" y="111" width="480" height="24" rx="12" fill="#E6E8EC"/>

    <!-- app nav -->
    <rect x="150" y="146" width="1300" height="56" fill="#1F3A63"/>
    <text x="192" y="182" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="1">AMPLIFY</text>
    <text x="1250" y="181" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="end">Give</text>
    <text x="1345" y="181" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="end">Amplify</text>
    <rect x="1283" y="187" width="62" height="2.5" fill="#FFFFFF"/>
    <text x="1410" y="181" font-size="17" font-weight="600" fill="#FFFFFF" text-anchor="end">Learn</text>

    <!-- campaign banner -->
    <rect x="150" y="202" width="1300" height="126" fill="#3B5B8A"/>
    <text x="800" y="254" font-size="34" font-weight="700" fill="#FFFFFF" text-anchor="middle">Clean Futures Act</text>
    <text x="800" y="298" font-size="22" fill="#FFFFFF" text-anchor="middle"><tspan font-weight="700">20,436</tspan> letters sent</text>

    <!-- left: find your representatives -->
    <rect x="569" y="328" width="1" height="732" fill="#E3E6EA"/>
    <rect x="196" y="366" width="300" height="40" rx="6" fill="#FFFFFF" stroke="#C9CED6"/>
    <text x="212" y="392" font-size="17" fill="#2B3440">90210</text>
    <rect x="196" y="422" width="88" height="30" rx="15" fill="#1F3A63"/>
    <text x="240" y="442" font-size="14" font-weight="600" fill="#FFFFFF" text-anchor="middle">Federal</text>
    <rect x="294" y="422" width="72" height="30" rx="15" fill="#FFFFFF" stroke="#C9CED6"/>
    <text x="330" y="442" font-size="14" font-weight="600" fill="#2B3440" text-anchor="middle">State</text>
    <rect x="376" y="422" width="84" height="30" rx="15" fill="#FFFFFF" stroke="#C9CED6"/>
    <text x="418" y="442" font-size="14" font-weight="600" fill="#2B3440" text-anchor="middle">County</text>

    <!-- representative rows: the first is selected -->
    <rect x="150" y="484" width="419" height="90" fill="#EEF2F7"/>
    <use href="#rep" y="529"/>
    <rect x="283" y="512" width="150" height="14" rx="7" fill="#2B3440"/>
    <rect x="283" y="536" width="200" height="10" rx="5" fill="#AEB6C2"/>
    <use href="#rep" y="629"/>
    <rect x="283" y="612" width="130" height="14" rx="7" fill="#2B3440"/>
    <rect x="283" y="636" width="190" height="10" rx="5" fill="#AEB6C2"/>
    <use href="#rep" y="729"/>
    <rect x="283" y="712" width="160" height="14" rx="7" fill="#2B3440"/>
    <rect x="283" y="736" width="220" height="10" rx="5" fill="#AEB6C2"/>

    <!-- right: the letter, in three steps -->
    <g transform="translate(640 372)">
      <!-- step 1, open -->
      <circle cx="24" cy="24" r="24" fill="#1F3A63"/>
      <text x="24" y="33" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
      <text x="70" y="22" font-size="24" font-weight="700" fill="#1F3A63">Review the letter</text>
      <text x="70" y="48" font-size="15" fill="#6B7380">Add any additional details to organizer requests.</text>
      <path d="M714 30 l14 -14 l14 14" fill="none" stroke="#1F3A63" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

      <!-- letter body -->
      <g transform="translate(70 80)" fill="#C9CED6">
        <rect width="90" height="9" rx="4.5"/>
        <rect y="18" width="70" height="9" rx="4.5"/>
        <rect y="36" width="130" height="9" rx="4.5"/>
        <rect y="66" width="60" height="9" rx="4.5"/>
        <rect y="84" width="210" height="9" rx="4.5"/>
        <rect y="102" width="150" height="9" rx="4.5"/>
        <rect y="132" width="200" height="9" rx="4.5" fill="#2B3440"/>
        <rect y="162" width="640" height="9" rx="4.5"/>
        <rect y="180" width="600" height="9" rx="4.5"/>
        <rect y="198" width="520" height="9" rx="4.5"/>
      </g>

      <!-- your own story: the one field people type into -->
      <rect x="70" y="316" width="640" height="66" rx="6" fill="#FFFFFF" stroke="#1F3A63" stroke-width="2"/>
      <text x="90" y="343" font-size="16" font-weight="600" fill="#1F3A63">I'm in support because…</text>
      <text x="90" y="368" font-size="14" fill="#6B7380">(optional, but your story makes a difference)</text>

      <rect x="70" y="410" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#8A919C"/>
      <text x="96" y="423" font-size="14" fill="#6B7380">Agree to <tspan fill="#1F3A63" font-weight="600">User Guidelines</tspan></text>
      <rect x="586" y="398" width="124" height="40" rx="6" fill="#1F3A63"/>
      <text x="648" y="424" font-size="16" font-weight="700" fill="#FFFFFF" text-anchor="middle">Next</text>

      <rect x="0" y="466" width="740" height="1" fill="#E3E6EA"/>

      <!-- steps 2 and 3, waiting -->
      <circle cx="24" cy="508" r="24" fill="#D5D9E0"/>
      <text x="24" y="517" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
      <text x="70" y="506" font-size="24" font-weight="600" fill="#8A919C">Sign your name</text>
      <text x="70" y="532" font-size="15" fill="#A5ABB5">Use your legal name.</text>
      <path d="M714 500 l14 14 l14 -14" fill="none" stroke="#B4BAC4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>

      <rect x="0" y="552" width="740" height="1" fill="#E3E6EA"/>

      <circle cx="24" cy="594" r="24" fill="#D5D9E0"/>
      <text x="24" y="603" font-size="24" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
      <text x="70" y="592" font-size="24" font-weight="600" fill="#8A919C">Send the letter</text>
      <text x="70" y="618" font-size="15" fill="#A5ABB5">Postage is $1.00 to send your letter.</text>
      <path d="M714 586 l14 14 l14 -14" fill="none" stroke="#B4BAC4" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
</svg>
