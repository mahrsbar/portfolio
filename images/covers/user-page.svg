<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" font-family="'Instrument Sans', Inter, Helvetica, Arial, sans-serif">
  <!-- The unified user page, recreated: an account header, one card per operator, the timeline
       that drives every card, KPIs and the map. Drawn flat; identifiers are bars, not real data. -->
  <defs>
    <clipPath id="win"><rect x="150" y="100" width="1300" height="960" rx="18"/></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#1F3A63" flood-opacity=".16"/>
    </filter>
  </defs>

  <!-- no backdrop: the page paints it (.cover-frame in accents.css) so it follows light/dark -->

  <g filter="url(#shadow)">
    <rect x="150" y="100" width="1300" height="960" rx="18" fill="#FFFFFF"/>
  </g>
  <g clip-path="url(#win)">
    <!-- title bar -->
    <rect x="150" y="100" width="1300" height="46" fill="#F3F4F6"/>
    <circle cx="182" cy="123" r="7" fill="#D9DCE1"/>
    <circle cx="206" cy="123" r="7" fill="#D9DCE1"/>
    <circle cx="230" cy="123" r="7" fill="#D9DCE1"/>
    <rect x="560" y="111" width="480" height="24" rx="12" fill="#E6E8EC"/>

    <!-- app top bar -->
    <rect x="150" y="146" width="1300" height="60" fill="#FFFFFF"/>
    <rect x="150" y="205" width="1300" height="1" fill="#E6E8EC"/>
    <rect x="190" y="166" width="22" height="22" rx="5" fill="#1F3A63"/>
    <rect x="226" y="164" width="300" height="26" rx="13" fill="#F3F4F6"/>
    <text x="1410" y="182" font-size="15" fill="#6B7280" text-anchor="end">UTC −4</text>

    <!-- status alert -->
    <rect x="190" y="230" width="1220" height="44" rx="8" fill="#FCE9E4"/>
    <text x="210" y="258" font-size="17" font-weight="600" fill="#B8402F">⚠ This user has a different status across several operators.</text>
    <text x="1390" y="258" font-size="16" fill="#1A1F29" text-anchor="end">View history</text>

    <!-- account header -->
    <circle cx="212" cy="316" r="18" fill="#D8E0EC"/>
    <rect x="244" y="302" width="190" height="20" rx="5" fill="#1A1F29"/>
    <rect x="450" y="306" width="110" height="12" rx="4" fill="#C9D0DA"/>
    <rect x="576" y="306" width="110" height="12" rx="4" fill="#C9D0DA"/>
    <rect x="1024" y="298" width="150" height="38" rx="19" fill="#FFFFFF" stroke="#C9D0DA" stroke-width="2"/>
    <text x="1099" y="323" font-size="16" fill="#1A1F29" text-anchor="middle">All operators ▾</text>
    <rect x="1190" y="298" width="104" height="38" rx="19" fill="#E8553D"/>
    <text x="1242" y="323" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Block</text>
    <rect x="1306" y="298" width="104" height="38" rx="19" fill="#DCEFEA"/>
    <text x="1358" y="323" font-size="16" font-weight="600" fill="#1F6E5B" text-anchor="middle">Unblock</text>

    <!-- tabs -->
    <text x="192" y="382" font-size="17" font-weight="600" fill="#1A1F29">Summary</text>
    <rect x="190" y="392" width="84" height="3" fill="#1A1F29"/>
    <text x="304" y="382" font-size="17" fill="#8A93A2">Anti-fraud</text>
    <rect x="150" y="394" width="1300" height="1" fill="#E6E8EC"/>

    <!-- operator cards -->
    <g>
      <rect x="190" y="420" width="392" height="96" rx="10" fill="#FFFFFF" stroke="#E6E8EC" stroke-width="2"/>
      <rect x="190" y="420" width="4" height="96" fill="#E8553D"/>
      <text x="212" y="452" font-size="16" font-weight="600" fill="#1A1F29">Operator 1</text>
      <rect x="494" y="434" width="72" height="24" rx="12" fill="#E8553D"/>
      <text x="530" y="451" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Blocked</text>
      <rect x="212" y="470" width="150" height="10" rx="3" fill="#C9D0DA"/>
      <rect x="212" y="490" width="220" height="10" rx="3" fill="#E1E5EB"/>
    </g>
    <g>
      <rect x="604" y="420" width="392" height="96" rx="10" fill="#FFFFFF" stroke="#E6E8EC" stroke-width="2"/>
      <rect x="604" y="420" width="4" height="96" fill="#E8553D"/>
      <text x="626" y="452" font-size="16" font-weight="600" fill="#1A1F29">Operator 2</text>
      <rect x="908" y="434" width="72" height="24" rx="12" fill="#E8553D"/>
      <text x="944" y="451" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Blocked</text>
      <rect x="626" y="470" width="150" height="10" rx="3" fill="#C9D0DA"/>
      <rect x="626" y="490" width="190" height="10" rx="3" fill="#E1E5EB"/>
    </g>
    <g>
      <rect x="1018" y="420" width="392" height="96" rx="10" fill="#FFFFFF" stroke="#E6E8EC" stroke-width="2"/>
      <text x="1040" y="452" font-size="16" font-weight="600" fill="#1A1F29">Operator 3</text>
      <rect x="1328" y="434" width="66" height="24" rx="12" fill="#DCEFEA"/>
      <text x="1361" y="451" font-size="13" font-weight="600" fill="#1F6E5B" text-anchor="middle">Active</text>
      <rect x="1040" y="470" width="150" height="10" rx="3" fill="#C9D0DA"/>
      <rect x="1040" y="490" width="120" height="10" rx="3" fill="#E1E5EB"/>
    </g>

    <!-- the timeline that drives every card -->
    <rect x="190" y="548" width="150" height="34" rx="17" fill="#FFFFFF" stroke="#C9D0DA" stroke-width="2"/>
    <text x="265" y="571" font-size="15" fill="#1A1F29" text-anchor="middle">Date range ▾</text>
    <text x="1410" y="571" font-size="15" fill="#8A93A2" text-anchor="end">the timeline drives every card below</text>
    <g fill="#C9D0DA">
      <rect x="190" y="660" width="40" height="24" rx="3"/><rect x="240" y="640" width="40" height="44" rx="3"/><rect x="290" y="652" width="40" height="32" rx="3"/>
      <rect x="340" y="628" width="40" height="56" rx="3"/><rect x="390" y="648" width="40" height="36" rx="3"/><rect x="440" y="620" width="40" height="64" rx="3"/>
      <rect x="490" y="656" width="40" height="28" rx="3"/><rect x="540" y="636" width="40" height="48" rx="3"/><rect x="590" y="650" width="40" height="34" rx="3"/>
      <rect x="640" y="612" width="40" height="72" rx="3"/><rect x="690" y="654" width="40" height="30" rx="3"/><rect x="740" y="640" width="40" height="44" rx="3"/>
    </g>
    <g class="cv-hi" fill="#E8553D">
      <rect x="790" y="596" width="40" height="88" rx="3"/><rect x="840" y="612" width="40" height="72" rx="3"/><rect x="890" y="580" width="40" height="104" rx="3"/>
      <rect x="940" y="620" width="40" height="64" rx="3"/><rect x="990" y="604" width="40" height="80" rx="3"/>
    </g>
    <g fill="#C9D0DA">
      <rect x="1040" y="650" width="40" height="34" rx="3"/><rect x="1090" y="660" width="40" height="24" rx="3"/><rect x="1140" y="644" width="40" height="40" rx="3"/>
      <rect x="1190" y="656" width="40" height="28" rx="3"/><rect x="1240" y="662" width="40" height="22" rx="3"/><rect x="1290" y="648" width="40" height="36" rx="3"/><rect x="1340" y="664" width="40" height="20" rx="3"/>
    </g>
    <rect x="190" y="684" width="1220" height="2" fill="#E1E5EB"/>
    <rect class="cv-sel" x="780" y="590" width="260" height="100" rx="6" fill="none" stroke="#E8553D" stroke-width="2" stroke-dasharray="6 6"/>

    <!-- KPIs -->
    <g font-size="14" fill="#6B7280">
      <rect x="190" y="716" width="290" height="92" rx="10" fill="#FFFFFF" stroke="#E6E8EC" stroke-width="2"/>
      <text x="212" y="746">Total transactions</text>
      <rect x="212" y="762" width="90" height="24" rx="4" fill="#1A1F29"/>
      <rect x="500" y="716" width="290" height="92" rx="10" fill="#FFFFFF" stroke="#E6E8EC" stroke-width="2"/>
      <text x="522" y="746">Failed rate</text>
      <rect x="522" y="762" width="70" height="24" rx="4" fill="#1A1F29"/>
      <rect class="cv-pill" x="604" y="764" width="34" height="20" rx="10" fill="#FCE9E4"/>
      <text x="621" y="779" font-size="13" fill="#B8402F" text-anchor="middle">▼</text>
      <rect x="810" y="716" width="290" height="92" rx="10" fill="#FFFFFF" stroke="#E6E8EC" stroke-width="2"/>
      <text x="832" y="746">In residential areas</text>
      <rect x="832" y="762" width="70" height="24" rx="4" fill="#1A1F29"/>
      <rect class="cv-pill" x="914" y="764" width="34" height="20" rx="10" fill="#DCEFEA"/>
      <text x="931" y="779" font-size="13" fill="#1F6E5B" text-anchor="middle">▲</text>
      <rect x="1120" y="716" width="290" height="92" rx="10" fill="#FFFFFF" stroke="#E6E8EC" stroke-width="2"/>
      <text x="1142" y="746">In stadiums</text>
      <rect x="1142" y="762" width="70" height="24" rx="4" fill="#1A1F29"/>
      <rect class="cv-pill" x="1224" y="764" width="34" height="20" rx="10" fill="#DCEFEA"/>
      <text x="1241" y="779" font-size="13" fill="#1F6E5B" text-anchor="middle">▲</text>
    </g>

    <!-- map + transaction list, running off the bottom -->
    <text x="192" y="856" font-size="17" font-weight="600" fill="#1A1F29">Transactions map</text>
    <rect x="190" y="874" width="860" height="220" rx="12" fill="#EEF2F5"/>
    <g fill="#E1E7EC">
      <rect x="230" y="900" width="200" height="90" rx="8"/>
      <rect x="520" y="920" width="260" height="70" rx="8"/>
      <path d="M190 1040 C400 1000 600 1060 1050 1010 L1050 1094 L190 1094 Z"/>
    </g>
    <g fill="#E8553D">
      <circle cx="380" cy="960" r="9"/><circle cx="640" cy="1000" r="9"/><circle cx="840" cy="940" r="9"/><circle cx="920" cy="1020" r="9"/>
    </g>
    <rect x="1070" y="874" width="340" height="220" rx="12" fill="#FFFFFF" stroke="#E6E8EC" stroke-width="2"/>
    <text x="1092" y="906" font-size="15" font-weight="600" fill="#1A1F29">Transactions</text>
    <text x="1210" y="906" font-size="15" fill="#8A93A2">Devices</text>
    <rect x="1092" y="928" width="296" height="1" fill="#E6E8EC"/>
    <rect x="1092" y="946" width="180" height="12" rx="4" fill="#1A1F29"/>
    <rect x="1092" y="970" width="240" height="10" rx="3" fill="#E1E5EB"/>
    <rect x="1092" y="990" width="200" height="10" rx="3" fill="#E1E5EB"/>
    <rect x="1092" y="1010" width="260" height="10" rx="3" fill="#E1E5EB"/>
    <rect x="1092" y="1030" width="150" height="10" rx="3" fill="#E1E5EB"/>
  </g>
</svg>
