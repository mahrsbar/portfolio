<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>OG</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:ital,wght@0,400..700;1,400..700&family=Spline+Sans+Mono:wght@300..700&display=swap" />
<style>
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background: #f5f6f7; color: #14161a;
    font-family: "Familjen Grotesk", "Helvetica Neue", Arial, sans-serif;
    display: grid; grid-template-columns: 1fr 380px; align-items: center;
    padding: 0 78px; box-sizing: border-box; gap: 40px;
  }
  h1 { font-size: 96px; font-weight: 700; letter-spacing: -.045em; line-height: .95; margin: 0; }
  .role {
    font-family: "Spline Sans Mono", monospace; font-size: 20px; letter-spacing: .16em;
    text-transform: uppercase; color: #646a72; margin: 18px 0 0;
  }
  .claim { font-size: 30px; line-height: 1.3; letter-spacing: -.015em; color: #454a50; margin: 30px 0 0; max-width: 640px; }
  .claim em { font-style: italic; color: #0f4ecd; }
  .degrees { display: flex; gap: 36px; margin: 34px 0 0; }
  .degrees div { font-size: 17px; color: #454a50; line-height: 1.4; }
  .degrees b { display: block; font-size: 18px; color: #14161a; }
  .degrees span { font-family: "Spline Sans Mono", monospace; font-size: 14px; color: #646a72; letter-spacing: .06em; }
  figure { margin: 0; }
  svg { width: 100%; height: auto; display: block; isolation: isolate; }
  .pa { fill: #0f4ecd; }
  .pb { fill: #ff3d8b; mix-blend-mode: multiply; }
</style>
</head>
<body>
  <div>
    <h1>Mahrs Aslam</h1>
    <p class="role">UX Engineer &middot; Vancouver, BC</p>
    <p class="claim">Every interface is a theory about how people think. I happen to have studied the theory and <em>written the code that tests it</em>.</p>
    <div class="degrees">
      <div><b>B.A. Psychology</b>University of Alberta <span>2013&ndash;2016</span></div>
      <div><b>B.Sc. Computer Science</b>University of Regina <span>2017&ndash;2019</span></div>
    </div>
  </div>
  <figure>
    <svg viewBox="50 20 200 320">
      <defs><path id="profile" d="M150 34 C198 34 230 66 236 110 C238 123 231 129 227 135 C233 146 248 158 248 167 C248 176 232 176 224 176 C226 185 228 193 221 198 C215 202 211 202 211 208 C211 217 224 223 221 232 C218 243 203 251 190 255 C183 259 183 274 185 289 L187 322 L128 322 C128 284 124 268 111 255 C86 229 70 200 68 162 C64 102 101 34 150 34 Z" /></defs>
      <g><use href="#profile" class="pa" transform="translate(-7,-6)" />
      <use href="#profile" class="pb" transform="translate(7,6)" /></g>
    </svg>
  </figure>
</body>
</html>
